# Render Blueprint configuration for Referee
# Verified against Render Blueprint Specification (https://render.com/docs/blueprint-spec)

services:
  # Web Application (Next.js App Router)
  - type: web
    name: referee-web
    runtime: node
    plan: starter
    buildCommand: pnpm install && pnpm build
    startCommand: pnpm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PAYPAL_ENV
        value: sandbox
      - key: DATABASE_URL
        fromDatabase:
          name: referee-db
          property: connectionString
      - key: APP_URL
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_PLATFORM_EMAIL
        sync: false
      - key: KERNEL_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: google
      - key: LLM_MODEL
        value: gemini-2.5-flash
      - key: LLM_API_KEY
        sync: false
      - key: INTERNAL_SWEEP_SECRET
        generateValue: true
      - key: DEMO_MODE
        value: "true"
      - key: DEMO_TIME_SCALE
        value: "1440"
      - key: HUMAN_APPROVAL_THRESHOLD
        value: "300"

  # Periodic Deadline Sweeper (Cron Job)
  - type: cron
    name: referee-deadline-sweep
    runtime: node
    schedule: "* * * * *"
    buildCommand: "true"
    startCommand: curl -s -f -X POST "${APP_URL}/api/internal/sweep" -H "Authorization: Bearer ${INTERNAL_SWEEP_SECRET}"
    envVars:
      - key: APP_URL
        fromService:
          type: web
          name: referee-web
          property: host
      - key: INTERNAL_SWEEP_SECRET
        fromService:
          type: web
          name: referee-web
          envVarKey: INTERNAL_SWEEP_SECRET

databases:
  # Managed PostgreSQL
  - name: referee-db
    databaseName: referee
    user: referee
    plan: starter

